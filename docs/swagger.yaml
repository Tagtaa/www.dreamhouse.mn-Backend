          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Status is required and must be wrong, confirmed, or rejected'
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Deposit not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Internal server error'

    delete:
      tags:
        - Admin
      summary: Delete deposit
      description: Delete a deposit (only wrong deposits can be deleted)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Deposit ID
      responses:
        '200':
          description: Deposit deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Deposit deleted successfully'
        '400':
          description: Cannot delete non-wrong deposit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Only wrong deposits can be deleted'
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Deposit not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Internal server error'

components:
