  # Calculation Types
  /api/calculations/{type}/choose-types:
    get:
      tags:
        - Calculations
      summary: Get calculation types for a specific calculation
      description: |
        Get all available types (e.g., wall types, roof shapes) for a specific calculation type.
        Each type includes an image, name, and description for the "Choose Type" interface.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [wall, fundament, roof, inner_wall, underfloor, floor_tiles, wall_decoration]
            description: Calculation type
      responses:
        '200':
          description: Calculation types retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      types:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: '68aadecff22d89e7206c3228'
                            calculationType:
                              type: string
                              example: 'wall'
                            key:
                              type: string
                              example: 'brick'
                            name:
                              type: string
                              example: 'Brick'
                            imageUrl:
                              type: string
                              format: uri
                              example: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&h=300&fit=crop'
                            description:
                              type: string
                              example: 'Traditional red brick wall construction'
                            isActive:
                              type: boolean
                              example: true
                            sortOrder:
                              type: number
                              example: 1
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
        '401':
          description: Unauthorized - Authentication required
        '500':
          description: Internal server error

    post:
      tags:
        - Calculations
      summary: Create new calculation type for a specific calculation
      description: |
        Create a new calculation type for a specific calculation (Admin only).
        Used for adding new options to "Choose Type" interfaces.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [wall, fundament, roof, inner_wall, underfloor, floor_tiles, wall_decoration]
            description: Calculation type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - name
                - imageUrl
              properties:
                key:
                  type: string
                  description: Unique identifier for the type
                  example: 'brick'
                name:
                  type: string
                  description: Display name for the type
                  example: 'Brick'
                imageUrl:
                  type: string
                  format: uri
                  description: Image URL for the type
                  example: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&h=300&fit=crop'
                description:
                  type: string
                  description: Detailed description of the type
                  example: 'Traditional red brick wall construction'
                sortOrder:
                  type: number
                  description: Order for display (lower numbers first)
                  example: 1
      responses:
        '201':
          description: Calculation type created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Calculation type created successfully'
                  data:
                    type: object
                    properties:
                      type:
                        $ref: '#/components/schemas/CalculationType'
        '400':
          description: Bad request - validation error
        '401':
          description: Unauthorized - Authentication required
