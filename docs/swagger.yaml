  /sms-parser/responses/cleanup:
    post:
      tags:
        - SMS Parser
      summary: Cleanup old SMS Parser responses
      description: Remove old SMS Parser API responses to free up storage
      security:
        - smsParserApiKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 0
                  maximum: 365
                  default: 30
                  description: Remove responses older than this many days (0 = all responses)
      responses:
        '200':
          description: Cleanup completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'All responses cleared successfully'
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                        example: 1250
                examples:
                  all_responses:
                    summary: Clear all responses
                    value:
                      success: true
                      message: 'All responses cleared successfully'
                      data:
                        deletedCount: 1250
                  old_responses:
                    summary: Clear old responses
                    value:
                      success: true
                      message: 'Cleaned up responses older than 30 days'
                      data:
                        deletedCount: 1250
        '401':
          description: Invalid SMS Parser API key

