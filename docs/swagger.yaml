                          type: object
                          properties:
                            _id:
                              type: string
                              example: 'verify-otp'
                            statusCodes:
                              type: array
                              items:
                                type: object
                                properties:
                                  statusCode:
                                    type: integer
                                    example: 200
                                  isSuccess:
                                    type: boolean
                                    example: true
