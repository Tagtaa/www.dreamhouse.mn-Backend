          schema:
            type: integer
            minimum: 100
            maximum: 599
        - name: startDate
          in: query
          description: Filter from date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter to date
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Response statistics
          content:
            application/json:
              schema:
                type: object
