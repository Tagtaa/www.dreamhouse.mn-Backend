  # SMS Parser Integration
  /sms-parser/verify-otp:
    post:
      tags:
        - SMS Parser
      summary: Verify OTP via SMS Parser App
      description: |
        Webhook endpoint called by SMS Parser App to confirm that a user has sent the OTP code via SMS.
        This endpoint is called automatically by the SMS Parser App, not by the mobile app directly.
      security:
        - smsParserApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
                - otpCode
                - smsContent
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                  description: User's phone number
                otpCode:
                  type: string
                  pattern: '^[0-9]{5}$'
                  example: '84739'
                  description: The OTP code sent via SMS
                smsContent:
                  type: string
                  example: '84739'
                  description: Full SMS content received
                smsTimestamp:
                  type: string
                  format: date-time
                  example: '2024-01-20T10:30:00Z'
                  description: When the SMS was received
                parserAppVersion:
                  type: string
                  example: '1.0.0'
                  description: SMS Parser App version
      responses:
        '200':
          description: OTP verification confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'OTP verification confirmed'
                  data:
                    type: object
                    properties:
                      phoneNumber:
                        type: string
                        example: '+97612345678'
                      otpCode:
                        type: string
                        example: '84739'
                      verificationId:
                        type: string
                        example: '65f1234567890abcd1234567'
                      confirmedAt:
                        type: string
                        format: date-time
        '400':
          description: Invalid request data or phone number mismatch
        '404':
          description: Invalid or expired OTP code
        '401':
          description: Invalid SMS Parser API key
        '500':
          description: Internal server error

  /sms-parser/bank-transaction:
    post:
      tags:
        - SMS Parser
      summary: Process bank SMS for wallet recharge
      description: |
        Webhook endpoint called by SMS Parser App when it receives a bank SMS.
        Automatically adds money to the user's wallet based on the SMS content.
      security:
        - smsParserApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - smsContent
                - phoneNumber
                - amount
                - bankName
              properties:
                smsContent:
                  type: string
                  example: '500₮ received from Khan Bank. Note: +97612345678'
                  description: Full bank SMS content
                phoneNumber:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                  description: User's phone number from transaction note
                amount:
                  type: number
                  minimum: 1
                  example: 500
                  description: Transaction amount
                bankName:
                  type: string
                  example: 'Khan Bank'
                  description: Bank name from SMS
                transactionNote:
                  type: string
                  example: '+97612345678'
                  description: Transaction note/reference
                smsTimestamp:
                  type: string
                  format: date-time
                  example: '2024-01-20T10:30:00Z'
                  description: When the SMS was received
                parserAppVersion:
                  type: string
                  example: '1.0.0'
                  description: SMS Parser App version
      responses:
        '200':
          description: Wallet recharged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Wallet recharged successfully'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: '65f1234567890abcd1234567'
                          phone:
                            type: string
                            example: '+97612345678'
                          username:
                            type: string
                            example: 'John Builder'
                      transaction:
                        type: object
                        properties:
                          id:
                            type: string
                            example: '65f1234567890abcd1234567'
                          amount:
                            type: number
                            example: 500
                          bankName:
                            type: string
                            example: 'Khan Bank'
                          balanceBefore:
                            type: number
                            example: 1000
                          balanceAfter:
                            type: number
                            example: 1500
                          processedAt:
                            type: string
                            format: date-time
        '400':
          description: Invalid request data
        '404':
          description: User not found with this phone number
        '401':
          description: Invalid SMS Parser API key
        '500':
          description: Internal server error

