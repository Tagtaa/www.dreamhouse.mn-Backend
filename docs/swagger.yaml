  # Calculations
  /api/calculations/types:
    get:
      tags:
        - Calculations
      summary: Get calculation types
      description: |
        Get list of all available calculation types with premium status.
        Premium members can access all types, free users have limited access.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Calculation types retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      types:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              example: 'wall'
                            name:
                              type: string
                              example: 'Wall'
                            description:
                              type: string
                              example: 'Calculate wall materials and costs'
                            icon:
                              type: string
                              example: 'wall-icon'
                            imageUrl:
                              type: string
                              format: uri
                              example: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&h=300&fit=crop'
                              description: 'Image URL for the calculation type'
                            isPremium:
                              type: boolean
                              example: false
        '401':
          description: Unauthorized - Authentication required
        '500':
          description: Internal server error

  /api/calculations:
    post:
      tags:
        - Calculations
      summary: Calculate materials for any type
      description: |
        Unified calculation endpoint that handles all calculation types.
        Premium membership required for fundament and roof calculations.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - selectedTypeModel
                - selectedShapeModel
                - selectedMaterialModel
                - selectedThicknessModel
                - totalPrice
                - totalVolume
                - materialItemCount
              properties:
                selectedTypeModel:
                  type: object
                  description: Selected calculation type model
                  required:
                    - id
                    - calculationType
                    - key
                    - name
                  properties:
                    id:
                      type: string
                      format: mongodb-objectid
                      example: '64b1c1d8e4b0f1a2c3d4e5f6'
                    calculationType:
                      type: string
                      enum: [wall, fundament, roof, inner_wall, underfloor, floor_tiles, wall_decoration]
                      example: 'wall'
                    key:
                      type: string
                      example: 'brick_wall'
                    name:
                      type: string
                      example: 'Tuğla Duvar'
                    imageUrl:
                      type: string
                      format: uri
                      example: 'https://example.com/images/brick_wall.jpg'
                    description:
                      type: string
                      example: 'Geleneksel tuğla duvar yapısı'
                    isActive:
                      type: boolean
                      example: true
                    sortOrder:
                      type: integer
                      example: 1
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                
                selectedShapeModel:
                  type: object
                  description: Selected shape model
                  required:
                    - id
                    - calculationType
                    - key
                    - name
                  properties:
                    id:
                      type: string
                      format: mongodb-objectid
                      example: '64b1c1d8e4b0f1a2c3d4e5f7'
                    calculationType:
                      type: string
                      example: 'wall'
                    key:
                      type: string
                      example: 'rectangular'
                    name:
                      type: string
                      example: 'Dikdörtgen'
                    imageUrl:
                      type: string
                      format: uri
                      example: 'https://example.com/images/rectangular.jpg'
                    description:
                      type: string
                      example: 'Standart dikdörtgen duvar şekli'
                    isActive:
                      type: boolean
                      example: true
                    sortOrder:
                      type: integer
                      example: 1
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                
                selectedMaterialModel:
                  type: object
                  description: Selected material model
                  required:
                    - _id
                    - name
                    - price
                  properties:
                    _id:
                      type: string
                      format: mongodb-objectid
                      example: '64b1c1d8e4b0f1a2c3d4e5f8'
                    name:
                      type: string
                      example: 'Kırmızı Tuğla'
                    type:
                      type: string
                      example: 'Tuğla'
                    category:
                      type: object
                      properties:
                        _id:
                          type: string
                          format: mongodb-objectid
                        name:
                          type: string
                          example: 'Duvar Malzemeleri'
                        parentCategory:
                          type: object
                          properties:
                            _id:
                              type: string
                              format: mongodb-objectid
                            name:
                              type: string
                              example: 'İnşaat Malzemeleri'
                        images:
                          type: array
                          items:
                            type: string
                            format: uri
                    price:
                      type: number
                      example: 2.50
                    specs:
                      type: string
                      example: '20x10x5 cm standart tuğla'
                    rating:
                      type: number
                      example: 4.5
                    width:
                      type: number
                      example: 20
                    length:
                      type: number
                      example: 10
                    height:
                      type: number
                      example: 5
                    unit:
                      type: string
                      example: 'adet'
                    description:
                      type: string
                      example: 'Kaliteli kırmızı tuğla, dayanıklı yapı'
                    images:
                      type: array
                      items:
                        type: string
                        format: uri
                    ingredients:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 'Çimento'
                          requiredPercent:
                            type: number
                            example: 0.15
                          unit:
                            type: string
                            example: 'kg'
                          costPerM3:
                            type: number
                            nullable: true
                          costPerPacket:
                            type: number
                            example: 45.0
                          packageWeight:
                            type: number
                            example: 50.0
                    costPerUnit:
                      type: object
                      properties:
                        perM2:
                          type: number
                          example: 150.0
                        perM3:
                          type: number
                          example: 450.0
                        currency:
                          type: string
                          example: 'TRY'
                    supplier:
                      type: object
                      properties:
                        name:
                          type: string
                          example: 'ABC Yapı Malzemeleri'
                        contact:
                          type: string
                          example: '+90 212 555 0123'
                        location:
                          type: string
                          example: 'İstanbul, Türkiye'
                    formattedPrice:
                      type: string
                      example: '2,50 TL'
                    likeCount:
                      type: integer
                      example: 25
                    likedBy:
                      type: array
                      items:
                        type: string
                    isLiked:
                      type: boolean
                      example: true
                    isPremium:
                      type: boolean
                      example: false
                    isActive:
                      type: boolean
                      example: true
                    tags:
                      type: array
                      items:
                        type: string
                    popularity:
                      type: integer
                      example: 85
                    viewCount:
                      type: integer
                      example: 150
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                
                selectedThicknessModel:
                  type: object
                  description: Selected thickness model
                  required:
                    - id
                    - calculationType
                    - key
                    - name
                    - thickness
                  properties:
                    id:
                      type: string
                      format: mongodb-objectid
                      example: '64b1c1d8e4b0f1a2c3d4e5fc'
                    calculationType:
                      type: string
                      example: 'wall'
                    key:
                      type: string
                      example: 'standard_10cm'
                    name:
                      type: string
                      example: '10 cm Kalınlık'
                    thickness:
                      type: number
                      example: 10
                    unit:
                      type: string
                      example: 'cm'
                    imageUrl:
                      type: string
                      format: uri
                      example: 'https://example.com/thickness10.jpg'
                    description:
                      type: string
                      example: 'Standart 10 cm duvar kalınlığı'
                    isActive:
                      type: boolean
                      example: true
                    sortOrder:
                      type: integer
                      example: 1
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                
                totalPrice:
                  type: number
                  minimum: 0
                  example: 1875.50
                  description: Total calculated price
                
                totalVolume:
                  type: number
                  minimum: 0
                  example: 15.75
                  description: Total calculated volume in m3
                
                materialItemCount:
                  type: integer
                  minimum: 0
                  example: 750
                  description: Number of material items needed
                
                doorList:
                  type: array
                  description: List of doors
                  items:
                    type: object
                    properties:
                      width:
                        type: number
                        minimum: 0.1
                        example: 90.0
                      length:
                        type: number
                        minimum: 0.1
                        example: 210.0
                
                windowList:
                  type: array
                  description: List of windows
                  items:
                    type: object
                    properties:
                      width:
                        type: number
                        minimum: 0.1
                        example: 120.0
                      length:
                        type: number
                        minimum: 0.1
                        example: 100.0
                
                ingCalcModelList:
                  type: array
                  description: List of ingredient calculations
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: 'Çimento'
                      unit:
                        type: string
                        example: 'packet'
                      amount:
                        type: number
                        minimum: 0
                        example: 47.25
                      price:
                        type: number
                        minimum: 0
                        example: 2126.25
      responses:
        '200':
          description: Calculation completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Wall calculation completed'
                  data:
                    type: object
                    properties:
                      calculation:
                        $ref: '#/components/schemas/Calculation'
        '400':
          description: Bad request - Invalid input or calculation type
        '403':
          description: Forbidden - Premium membership required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Premium membership required for fundament calculations'
                  code:
                    type: string
                    example: 'PREMIUM_REQUIRED'
        '401':
          description: Unauthorized - Authentication required
        '500':
          description: Internal server error

