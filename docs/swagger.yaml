          example: '+97699887766'
          description: User phone number in Mongolia format
        orderId:
          type: string
          example: 'gTLvw4'
          description: Unique order identifier
        amount:
          type: number
          example: 5000
          description: Withdrawal amount in MNT
        date:
          type: string
          format: date-time
          example: '2023-11-10T12:25:00.000Z'
          description: Withdrawal date and time
        processedBy:
          type: string
          example: 'Operator1'
          description: Operator or system that processed the withdrawal
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
          example: 'pending'
          description: Withdrawal status
        notes:
          type: string
          nullable: true
          example: 'User requested withdrawal'
          description: Additional notes about the withdrawal
        createdAt:
          type: string
          format: date-time
          example: '2023-11-10T12:25:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2023-11-10T12:25:00.000Z'

