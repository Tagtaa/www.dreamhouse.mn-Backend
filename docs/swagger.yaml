openapi: 3.0.3
info:
  title: Dream House API
  description: |
    Construction Material Calculator Backend API
    
    ## Authentication
    This API uses JWT-based authentication with phone number verification.
    
    ## Role-Based Access Control
    The system implements a comprehensive role-based access control system:
    
    - **User** (`user`): Default role for regular users
    - **Moderator** (`moderator`): Can moderate content and manage basic user operations
    - **Admin** (`admin`): Full system access and user management capabilities
    
    ## Ban System
    Users can be banned by administrators with reason tracking and automatic API blocking.
    
    ## Base URL
    `http://localhost:3000/api`
    
    ## Phone Number Format
    All phone numbers must be in Mongolia format: `+976XXXXXXXX`
    
    ## Rate Limiting
    - 100 requests per 15 minutes per IP
    
  version: 1.0.0
  contact:
    name: Dream House Team
    email: support@dreamhouse.mn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Health
    description: API health monitoring
  - name: Authentication
    description: User authentication and verification
  - name: User Management
    description: User profile and account management
  - name: Materials
    description: Construction materials catalog
  - name: Ideas
    description: Construction ideas and guides
  - name: Calculations
    description: Material calculation engine
  - name: Payments
    description: Payment and membership management
  - name: Admin
    description: Administrative operations and user management
  - name: Upload
    description: File upload operations
  - name: SMS Parser
    description: SMS Parser App integration for OTP and wallet recharge

paths:
  # Health Check
  /api/health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Check if the API server is running and healthy
      responses:
        '200':
          description: API is healthy and running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
                    example: 'API is running'
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00.000Z'
                  uptime:
                    type: number
                    example: 123.456
                    description: Server uptime in seconds

  # Authentication
  /api/auth/send-code:
    post:
      tags:
        - Authentication
      summary: Generate OTP code for SMS Parser system
      description: |
        Generates a verification code that the user needs to send via SMS to the SMS Parser phone number.
        The code is displayed to the user instead of being sent automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                  description: User's phone number in Mongolia format
      responses:
        '200':
          description: Verification code generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Verification code generated successfully'
                  data:
                    type: object
                    properties:
                      otpCode:
                        type: string
                        example: '84739'
                        description: 5-digit OTP code to send via SMS
                      sendToNumber:
                        type: string
                        example: '+97612345678'
                        description: SMS Parser phone number
                      instructions:
                        type: string
                        example: 'Send this code via SMS to the number: +97612345678'
                      expiresIn:
                        type: integer
                        example: 5
                        description: Code expiration time in minutes
                      phone:
                        type: string
                        example: '+97612345678'
        '400':
          description: Invalid phone number or user already exists
        '429':
          description: Too many requests
        '500':
          description: Failed to generate code

  /api/auth/verify-code:
    post:
      tags:
        - Authentication
      summary: Verify SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                code:
                  type: string
                  pattern: '^[0-9]{4}$'
                  example: '1234'
      responses:
        '200':
          description: Phone number verified successfully
        '400':
          description: Invalid or expired verification code

  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - username
                - password
              properties:
                phone:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                username:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: 'John Builder'
                password:
                  type: string
                  pattern: '^[0-9]{4}$'
                  example: '1234'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User registered successfully'
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      refreshToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - password
              properties:
                phone:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                password:
                  type: string
                  pattern: '^[0-9]{4}$'
                  example: '1234'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login successful'
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                      refreshToken:
                        type: string

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully

  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Generate password reset code (SMS Parser System)
      description: |
        Generates a password reset code for users who forgot their password.
        Similar to send-code but for existing users only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                  description: User's phone number in Mongolia format
      responses:
        '200':
          description: Password reset code generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Password reset code generated successfully'
                  data:
                    type: object
                    properties:
                      otpCode:
                        type: string
                        example: '84739'
                        description: 5-digit OTP code to send via SMS
                      sendToNumber:
                        type: string
                        example: '+97612345678'
                        description: SMS Parser phone number
                      instructions:
                        type: string
                        example: 'Send this code via SMS to the number: +97612345678'
                      expiresIn:
                        type: integer
                        example: 5
                        description: Code expiration time in minutes
                      phone:
                        type: string
                        example: '+97612345678'
        '404':
          description: User not found with this phone number
        '429':
          description: Too many requests
        '500':
          description: Failed to generate code

  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with verification code
      description: Reset user password using the verified OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
                - password
              properties:
                phone:
                  type: string
                  pattern: '^\+976[0-9]{8}$'
                  example: '+97612345678'
                code:
                  type: string
                  pattern: '^[0-9]{5}$'
                  example: '84739'
                password:
                  type: string
                  pattern: '^[0-9]{4}$'
                  example: '1234'
                  description: New 4-digit password
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid or expired verification code
        '404':
          description: User not found

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'

  # User Management
  /api/user/profile:
    get:
      tags:
        - User Management
      summary: Get user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
    put:
      tags:
        - User Management
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: 'John The Builder'
      responses:
        '200':
          description: Profile updated successfully

  /api/user/email:
    put:
      tags:
        - User Management
      summary: Update user email
      description: Update the email address for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                  description: Valid email address
      responses:
        '200':
          description: Email updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Email updated successfully'
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: 'user@example.com'
        '400':
          description: Bad request - Invalid email format or email required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Please enter a valid email address'
        '401':
          description: Authentication required
        '404':
          description: User not found
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Email already in use'
        '500':
          description: Internal server error

  /api/user/wallet:
    get:
      tags:
        - User Management
      summary: Get wallet information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      wallet:
                        type: object
                        properties:
                          balance:
                            type: number
                            example: 50000
                          currency:
                            type: string
                            example: 'MNT'

  /api/user/membership:
    get:
      tags:
        - User Management
      summary: Get membership information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Membership information

  /api/user/calculations:
    get:
      tags:
        - User Management
      summary: Get user's calculation history
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: type
          in: query
          schema:
            type: string
            enum: [wall, fundament, roof, inner_wall, underfloor, floor_tiles, wall_decoration]
      responses:
        '200':
          description: User calculations with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      calculations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Calculation'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /api/user/purchased-ideas:
    get:
      tags:
        - User Management
      summary: Get user's purchased ideas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Purchased ideas list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ideas:
                        type: array
                        items:
                          type: object
                          properties:
                            idea:
                              $ref: '#/components/schemas/Idea'
                            purchasedAt:
                              type: string
                              format: date-time
                            price:
                              type: number

  /api/user/account:
    delete:
      tags:
        - User Management
      summary: Deactivate (soft delete) user account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deactivated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Account deactivated successfully

  /api/user/upload-avatar:
    post:
      tags:
        - User Management
      summary: Upload profile avatar
      description: Placeholder endpoint for avatar upload; returns a sample image URL.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avatar upload response (placeholder)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Avatar upload functionality not implemented yet
                  data:
                    type: object
                    properties:
                      imageUrl:
                        type: string
                        example: https://via.placeholder.com/150

  # Materials
  /api/materials:
    get:
      tags:
        - Materials
      summary: Get materials list
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: category
          in: query
          schema:
            type: string
            enum: [wall, fundament, roof, inner_wall, underfloor, floor_tiles, wall_decoration]
        - name: subcategory
          in: query
          schema:
            type: string
        - name: isPremium
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Materials list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      materials:
                        type: array
                        items:
                          $ref: '#/components/schemas/Material'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
    post:
      tags:
        - Admin
      summary: Create new material (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - category
                - subcategory
                - price
              properties:
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                  enum: [wall, fundament, roof, inner_wall, underfloor, floor_tiles, wall_decoration]
                subcategory:
                  type: string
                imageUrl:
                  type: string
                price:
                  type: object
                  properties:
                    amount:
                      type: number
                    unit:
                      type: string
                    currency:
                      type: string
                specifications:
                  type: object
                isPremium:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                supplier:
                  type: object
      responses:
        '201':
          description: Material created successfully
        '400':
          description: Material with this name already exists
        '401':
          description: Authentication required
        '403':
          description: Admin access required
    post:
      tags:
        - Admin
      summary: Create new material (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - category
                - subcategory
                - price
                - specifications
              properties:
                name:
                  type: string
                  example: "Premium Steel Beam"
                description:
                  type: string
                  example: "High-quality steel beam for construction"
                category:
                  type: string
                  enum: [wall, fundament, roof, inner_wall, underfloor, floor_tiles, wall_decoration]
                  example: "wall"
                subcategory:
                  type: string
                  example: "steel_beam"
                imageUrl:
                  type: string
                  example: "https://example.com/image.jpg"
                price:
                  type: object
                  properties:
                    amount:
                      type: number
                      example: 50000
                    unit:
                      type: string
                      example: "piece"
                    currency:
                      type: string
                      example: "MNT"
                specifications:
                  type: object
                isPremium:
                  type: boolean
                  example: false
                tags:
                  type: array
                  items:
                    type: string
                supplier:
                  type: object
      responses:
        '201':
          description: Material created successfully
        '400':
          description: Material with this name already exists
        '401':
          description: Authentication required
        '403':
          description: Admin access required

  /api/materials/categories:
    get:
      tags:
        - Materials
      summary: Get material categories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Material categories

  /api/materials/parent-categories:
    get:
      tags:
        - Materials
      summary: Get parent categories
      description: Get all parent categories for materials
      responses:
        '200':
          description: Parent categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      parentCategories:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: number
                              example: 1
                            name:
                              type: string
                              example: "Wall"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Internal server error'

  /api/materials/search:
    get:
      tags:
        - Materials
      summary: Search materials
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Search results

  /api/materials/{id}:
    get:
      tags:
        - Materials
      summary: Get material by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Material details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      material:
                        $ref: '#/components/schemas/Material'
        '404':
          description: Material not found
    put:
      tags:
        - Admin
      summary: Update material (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Material updated successfully
        '404':
          description: Material not found
        '401':
          description: Authentication required
        '403':
          description: Admin access required
    delete:
      tags:
        - Admin
      summary: Delete material (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Material deleted successfully
        '404':
          description: Material not found
        '401':
          description: Authentication required
        '403':
          description: Admin access required
    put:
      tags:
        - Admin
      summary: Update material (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Material updated successfully
        '404':
          description: Material not found
        '401':
          description: Authentication required
        '403':
          description: Admin access required
    delete:
      tags:
        - Admin
      summary: Delete material (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Material deleted successfully
        '404':
          description: Material not found
        '401':
          description: Authentication required
        '403':
          description: Admin access required

  /api/materials/popular:
    get:
      tags:
        - Materials
      summary: Get popular materials
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Popular materials list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      materials:
                        type: array
                        items:
                          $ref: '#/components/schemas/Material'

  /api/materials/{id}/view:
    post:
      tags:
        - Materials
      summary: Increment material view count
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: View count updated
        '404':
          description: Material not found

  /api/materials/{id}/like:
    post:
      tags:
        - Materials
      summary: Like a material
      description: Add the material to user's liked materials
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Material ID
      responses:
        '200':
          description: Material liked successfully
          content:
            application/json:
              schema:
                type: object
